{% extends 'base.html' %}

{% block title %}Login - VegFruit Store{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Welcome Back</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <small style="color: var(--danger);">{{ field.errors.0 }}</small>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-purple">Login</button>
    </form>
    <p>Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a></p>
</div>
{% endblock %}
